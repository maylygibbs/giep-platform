<div *ngIf="step==1">
  <nav class="page-breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a (click)="back(null)">Usuarios a Evaluar</a></li>
      <li *ngIf="evaluation && evaluation.id" class="breadcrumb-item active" aria-current="page">Evaluación:
        {{evaluation.name}}</li>
    </ol>
   
  </nav>
  <div *ngIf="evaluation" class="row">
    <div class="col-lg-12 col-md-12">
      <div class="card">
        <!--List-->
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead>
                <tr>
                  <th>Usuario</th>
                  <th class="text-end">Acción</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let user of evaluation.users">
                  <td>
                    <div class="d-flex align-items-center">
                      <div class="avatar me-3" style="width: 40px; height: 40px; min-width: 40px;">
                        <div class="avatar-initial rounded-circle bg-primary d-flex align-items-center justify-content-center text-white fw-bold" style="width: 100%; height: 100%; font-size: 16px;">
                          {{user.firstName.charAt(0).toUpperCase()}}
                        </div>
                      </div>
                      <div>
                        <h6 class="mb-0">{{user.firstName}}</h6>
                        <small class="text-muted">{{user.email}}</small>
                        <br>
                        <small class="text-muted">
                          <span *ngFor="let role of user.roles; let last = last">
                            {{role.replace('ROLE_', '')}}<span *ngIf="!last">, </span>
                          </span>
                        </small>
                      </div>
                    </div>
                  </td>
                  <td class="text-end">
                    <button class="btn btn-primary btn-sm" (click)="evaluateUser(user)">
                      <i class="fe fe-edit me-1"></i>
                      Evaluar
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div *ngIf="step==2">
  <app-evaluation360 [user]="userSelected" [evaluation]="evaluationSelected"></app-evaluation360>
</div>

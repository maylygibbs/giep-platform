<nav class="page-breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink=".">Competencias-Unidad-Cargo-Dominio</a></li>
      <li *ngIf="selectedItem && !selectedItem.id" class="breadcrumb-item active" aria-current="page">Nueva relación</li>
      <li *ngIf="selectedItem && selectedItem.id" class="breadcrumb-item active" aria-current="page">Actualizar relación</li>
    </ol>
  </nav>
  
  <div *ngIf="step==1" class="row">
    <div class="col-lg-12 col-md-12 stretch-card">
      <div class="card">
        <div class="card-header">
          <div class="row">
            <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12 text-right">
              <div class="search-form">
                <div class="input-group">
                  <div class="input-group-text">
                    <i class="feather icon-search" (click)="search()"></i>
                  </div>
                  <input type="text" class="form-control" id="navbarForm" [(ngModel)]="word" (ngModelChange)="search()"  placeholder="Buscar aqui...">
                </div>
              </div>
            </div>
            <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12 text-right">
              <button type="button" (click)="create()" class="btn btn-primary btn-create-dt"  placement="start" ngbTooltip="Crear Relación">
                <i class="mdi mdi-plus"></i>
              </button>
            </div>
          </div>
        </div>
        <div class="card-body card-dt">
          <h6 class="card-title"></h6>
          <div class="row">
            <div class="col-lg-12" *ngIf="competencyUnits && competencyUnits.data">
              <table datatable [dtOptions]="dtOptions" class="table table-striped">
                <thead>
                  <tr>
                    <th>Id</th>
                    <th>Competencia</th>
                    <th>Unidad</th>
                    <th>Cargo</th>
                    <th>Nivel Dominio</th>                   
                    <th>Prioridad</th>
                    <th data-priority="1">Accion</th>
                  </tr>
                </thead>
                <tbody>
                  <tr
                    *ngFor="let item of competencyUnits.data | paginate: { id: 'server', itemsPerPage: environment.paginator.row_per_page, currentPage: page, totalItems: competencyUnits.count }">
                    <td>{{item.id}}</td>
                    <td>{{item.competency?.label}}</td>
                    <td>{{item.unit?.label}}</td>
                    <td>{{item.charge?.label}}</td>
                    <td>{{item.domainLevel?.label}}</td>
                    <td>{{item.priority}}</td>
                    <td class="text-center">
                      <i class="feather icon-edit-2" (click)="select(item.id)" placement="start" ngbTooltip="Editar Relación"></i>
                      <i hidden class="feather icon-trash ms-1" placement="start" ngbTooltip="Eliminar Relación" (click)="delete(item.id)"></i>
                    </td>
                  </tr>
                </tbody>
                <tfoot>
                  <tr>
                    <th colspan="7" class="text-right">
                      <app-pager (onChangePage)="loadPage($event)"></app-pager>
                    </th>
                  </tr>    
                </tfoot>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="step==2">
    <app-competencies-unit-charge-domain-store [competencyUnit]="selectedItem" (onBack)="back($event)"></app-competencies-unit-charge-domain-store>
  </div>

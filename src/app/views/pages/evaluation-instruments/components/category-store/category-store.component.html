<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <h4 class="card-title">{{category.id ? 'Editar' : 'Nueva'}} Categoría</h4>
                <form #form="ngForm" (ngSubmit)="onSubmit(form)">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control" name="label" [(ngModel)]="category.label" required>
                            </div>
                        </div>
                        <div class="col-md-6" hidden>
                            <div class="mb-3">
                                <label class="form-label">Estado</label>
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="status" [(ngModel)]="categoryStatus" name="status" (change)="onChangeStatus($event)">
                                    <label class="form-check-label" for="status">{{categoryStatus ? 'Activo' : 'Inactivo'}}</label>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Tipo</label>
                                <ng-select
                                    [items]="typeOptions"
                                    [clearable]="false"
                                    [searchable]="false"
                                    name="type"
                                    [(ngModel)]="category.type"
                                    required>
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea class="form-control" name="description" [(ngModel)]="category.description" rows="3"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-12">
                            <div class="mb-3">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="flag" [(ngModel)]="category.flag" name="flag" (change)="onChangeStatusFlag($event)">
                                    <label class="form-check-label" for="flag">Escala y Ponderación</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row" *ngIf="category.flag">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header">
                                    <h5 class="card-title">Escalas por Cargos</h5>
                                </div>
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-md-4" *ngFor="let scale of category.scales">
                                            <div class="mb-3">
                                                <label class="form-label">{{scale.label}}</label>
                                                <input type="number" class="form-control" [name]="scale.nameControlScale" [(ngModel)]="scale.scaleNumber" min="0" max="100" required>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-3" *ngIf="category.flag" style="display: none;">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header">
                                    <h5 class="card-title">Ponderaciones por Niveles</h5>
                                </div>
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-md-4" *ngFor="let weight of category.weights">
                                            <div class="mb-3">
                                                <label class="form-label">{{weight.label}}</label>
                                                <input type="number" class="form-control" [name]="weight.nameControlWeighing" [(ngModel)]="weight.weighingNumber" min="0" max="100" required>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-3">
                        <div class="col-12 text-end">
                            <button type="button" class="btn btn-secondary me-2" (click)="back()">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

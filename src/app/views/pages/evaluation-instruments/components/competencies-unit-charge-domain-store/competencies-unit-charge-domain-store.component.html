<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <h4 class="card-title">{{competencyUnit.id ? 'Editar' : 'Nueva'}} Relación Competencia-Unidad-Cargo-Dominio</h4>
                <form #form="ngForm" name="competencie360Form" #competencie360Form="ngForm" (ngSubmit)="onSubmit(competencie360Form)">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label required">Competencia</label>
                                <ng-select
                                    [items]="data.competencies"
                                    [clearable]="false"
                                    [searchable]="false"
                                    name="competency"
                                    #competency="ngModel"
                                    [(ngModel)]="competencyUnit.competency"
                                    bindLabel="label"
                                    bindValue="id"
                                    [compareWith]="compareWith"
                                    [ngClass]="{'ng-dirty ng-invalid' : competency.errors && ( competency.dirty || competency.touched || competencie360Form.submitted) }"
                                    required>
                                </ng-select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label required">Estructura Organizativa Nivel 1</label>
                                <ng-select
                                    [items]="data.units"
                                    [clearable]="false"
                                    [searchable]="true"
                                    name="unit"
                                    #unit="ngModel"
                                    [(ngModel)]="competencyUnit.nivel1"
                                    bindLabel="label"
                                    bindValue="id"
                                    [compareWith]="compareWith"
                                    (change)="onUnidadChange(competencyUnit.nivel1, 0)"
                                    [ngClass]="{'ng-dirty ng-invalid' : unit.errors && ( unit.dirty || unit.touched || competencie360Form.submitted) }"
                                    required>
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6"  *ngFor="let nivel of estructuraNiveles; let i = index">
                            <div class="mb-3">
                                <label class="form-label">Estructura Organizativa Nivel {{i+2}}</label>
                                <!-- Selects recursivos de estructura organizativa -->
                                <ng-select
                                    [items]="nivel.opciones"
                                    [clearable]="false"
                                    [searchable]="true"
                                    [(ngModel)]="estructuraNiveles[i].idSeleccionado"
                                    bindLabel="label"
                                    bindValue="id"
                                    name="estructuraNivel-{{i}}"                                    
                                    (change)="onEstructuraChange(estructuraNiveles[i].idSeleccionado, i)"
                                    placeholder="Seleccione una opción...">
                                </ng-select>

                            </div>
                        </div>
                    </div>
                    <ng-container *ngIf="competencyUnit.id; else newCompetencyUnit">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label required">Cargo</label>
                                    <ng-select
                                        [items]="data.charges"
                                        [clearable]="false"
                                        [searchable]="false"
                                        name="charge"   
                                        #charge="ngModel"
                                        [(ngModel)]="competencyUnit.charge"
                                        bindLabel="label"
                                        bindValue="id"
                                        [compareWith]="compareWith"
                                        [ngClass]="{'ng-dirty ng-invalid' : charge.errors && ( charge.dirty || charge.touched || competencie360Form.submitted) }"
                                        required>
                                    </ng-select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label required">Nivel de Dominio</label>
                                    <ng-select
                                        [items]="data.domainLevels"
                                        [clearable]="false"
                                        [searchable]="false"
                                        name="domainLevel"  
                                        #domainLevel="ngModel"
                                        [(ngModel)]="competencyUnit.domainLevel"
                                        bindLabel="label"
                                        bindValue="value"
                                        [compareWith]="compareWith"
                                        [ngClass]="{'ng-dirty ng-invalid' : domainLevel.errors && ( domainLevel.dirty || domainLevel.touched || competencie360Form.submitted) }"
                                        required>
                                    </ng-select>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label required">Prioridad</label>
                                    <input type="number" class="form-control" name="priority"  #priority="ngModel"  [ngClass]="{'ng-dirty ng-invalid' : priority.errors && ( priority.dirty || priority.touched || competencie360Form.submitted) }" [(ngModel)]="competencyUnit.priority" min="1"  required>
                                </div>
                            </div>
                        </div>
                    </ng-container>
                    <ng-template #newCompetencyUnit>
                        <div class="row mt-4">
                            <div class="col-12">
                                <div class="table-responsive">
                                    <table class="table table-bordered">
                                        <thead>
                                            <tr>
                                                <th>Cargo</th>
                                                <th>Nivel de Dominio</th>
                                                <th>Prioridad</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr *ngFor="let charge of data.charges; let i = index">
                                                <td>
                                                    {{charge.label}}
                                                    <input type="hidden" [ngModel]="competencyUnit.chargesDomainLevelPriority[i].charge.id" name="chargeId-{{i}}">
                                                </td>
                                                <td>
                                                    <ng-select
                                                        [items]="data.domainLevels"
                                                        [clearable]="false"
                                                        [searchable]="false"
                                                        [(ngModel)]="competencyUnit.chargesDomainLevelPriority[i].domainLevel"
                                                        name="domainLevel-{{i}}"
                                                        bindLabel="label"
                                                        bindValue="value"
                                                        [compareWith]="compareWith"
                                                        required>
                                                    </ng-select>
                                                </td>
                                                <td>
                                                    <input type="number" class="form-control" 
                                                        min="0"
                                                        [(ngModel)]="competencyUnit.chargesDomainLevelPriority[i].priority"
                                                        name="priority-{{i}}"
                                                        required>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </ng-template>

                    <div class="row mt-3">
                        <div class="col-12 text-end">
                            <button type="button" class="btn btn-secondary me-2" (click)="back()">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

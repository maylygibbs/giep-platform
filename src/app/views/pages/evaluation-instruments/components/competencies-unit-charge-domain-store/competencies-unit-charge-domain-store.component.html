<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <h4 class="card-title">{{competencyUnit.id ? 'Editar' : 'Nueva'}} Relación</h4>
                <form #form="ngForm" (ngSubmit)="onSubmit(form)">

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Competencia</label>
                                <ng-select
                                    [items]="data.competencies"
                                    [clearable]="false"
                                    [searchable]="false"
                                    name="competency"
                                    [(ngModel)]="competencyUnit.competency"
                                    bindLabel="label"
                                    bindValue="id"
                                    [compareWith]="compareWith"
                                    required>
                                </ng-select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Unidad</label>
                                <ng-select
                                    [items]="data.units"
                                    [clearable]="false"
                                    [searchable]="false"
                                    name="unit"
                                    [(ngModel)]="competencyUnit.unit"
                                    bindLabel="label"
                                    bindValue="id"
                                    [compareWith]="compareWith"
                                    required>
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Cargo</label>
                                <ng-select
                                    [items]="data.charges"
                                    [clearable]="false"
                                    [searchable]="false"
                                    name="charge"
                                    [(ngModel)]="competencyUnit.charge"
                                    bindLabel="label"
                                    bindValue="id"
                                    [compareWith]="compareWith"
                                    required>
                                </ng-select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Nivel de Dominio</label>
                                <ng-select
                                    [items]="data.domainLevels"
                                    [clearable]="false"
                                    [searchable]="false"
                                    name="domainLevel"
                                    [(ngModel)]="competencyUnit.domainLevel"
                                    bindLabel="label"
                                    bindValue="value"
                                    [compareWith]="compareWith"
                                    required>
                                </ng-select>
                            </div>
                        </div>
                    </div>


                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Prioridad</label>
                                <input type="number" class="form-control" name="priority" [(ngModel)]="competencyUnit.priority" min="1" max="3" required>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-3">
                        <div class="col-12 text-end">
                            <button type="button" class="btn btn-secondary me-2" (click)="back()">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
